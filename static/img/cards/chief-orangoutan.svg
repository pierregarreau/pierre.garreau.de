<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0ebe4"/>
      <stop offset="100%" stop-color="#f0ebe4"/>
    </linearGradient>
    <linearGradient id="nodeGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#428bca"/>
      <stop offset="100%" stop-color="#2a6496"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="halo" cx="50%" cy="25%" r="50%">
      <stop offset="0%" stop-color="#428bca" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#428bca" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg)"/>
  <rect width="600" height="400" fill="url(#halo)"/>

  <!-- Subtle background grid -->
  <g opacity="0.04" stroke="#428bca" stroke-width="0.5">
    <line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="450" y1="0" x2="450" y2="400"/>
  </g>

  <!-- Branch lines — from root (level 0) to level 1 -->
  <g stroke="#428bca" stroke-width="1" fill="none" opacity="0.4">
    <line x1="300" y1="70" x2="150" y2="185"/>
    <line x1="300" y1="70" x2="300" y2="185"/>
    <line x1="300" y1="70" x2="450" y2="185"/>
  </g>

  <!-- Branch lines — level 1 to level 2 -->
  <g stroke="#428bca" stroke-width="0.8" fill="none" opacity="0.25">
    <!-- Left branch children -->
    <line x1="150" y1="215" x2="60" y2="305"/>
    <line x1="150" y1="215" x2="150" y2="305"/>
    <!-- Middle branch children -->
    <line x1="300" y1="215" x2="240" y2="305"/>
    <line x1="300" y1="215" x2="300" y2="305"/>
    <line x1="300" y1="215" x2="360" y2="305"/>
    <!-- Right branch children -->
    <line x1="450" y1="215" x2="420" y2="305"/>
    <line x1="450" y1="215" x2="510" y2="305"/>
    <!-- Extra leaf lines level 2 to 3 (faint) -->
    <line x1="60" y1="325" x2="30" y2="370"/>
    <line x1="60" y1="325" x2="70" y2="370"/>
    <line x1="150" y1="325" x2="140" y2="370"/>
    <line x1="150" y1="325" x2="170" y2="370"/>
    <line x1="240" y1="325" x2="215" y2="370"/>
    <line x1="300" y1="325" x2="295" y2="370"/>
    <line x1="360" y1="325" x2="355" y2="370"/>
    <line x1="360" y1="325" x2="380" y2="370"/>
    <line x1="420" y1="325" x2="410" y2="370"/>
    <line x1="510" y1="325" x2="500" y2="370"/>
    <line x1="510" y1="325" x2="530" y2="370"/>
  </g>

  <!-- Level 3 leaf nodes (tiny, very faint) -->
  <g fill="#428bca" opacity="0.15">
    <circle cx="30" cy="372" r="3"/>
    <circle cx="70" cy="372" r="3"/>
    <circle cx="140" cy="372" r="3"/>
    <circle cx="170" cy="372" r="3"/>
    <circle cx="215" cy="372" r="3"/>
    <circle cx="295" cy="372" r="3"/>
    <circle cx="355" cy="372" r="3"/>
    <circle cx="380" cy="372" r="3"/>
    <circle cx="410" cy="372" r="3"/>
    <circle cx="500" cy="372" r="3"/>
    <circle cx="530" cy="372" r="3"/>
  </g>

  <!-- Level 2 nodes -->
  <g fill="#09090b" stroke="#428bca" stroke-width="1">
    <circle cx="60" cy="315" r="8" opacity="0.5"/>
    <circle cx="150" cy="315" r="8" opacity="0.5"/>
    <circle cx="240" cy="315" r="8" opacity="0.5"/>
    <circle cx="300" cy="315" r="8" opacity="0.5"/>
    <circle cx="360" cy="315" r="8" opacity="0.5"/>
    <circle cx="420" cy="315" r="8" opacity="0.5"/>
    <circle cx="510" cy="315" r="8" opacity="0.5"/>
  </g>
  <g fill="#428bca" opacity="0.3">
    <circle cx="60" cy="315" r="4"/>
    <circle cx="150" cy="315" r="4"/>
    <circle cx="240" cy="315" r="4"/>
    <circle cx="300" cy="315" r="4"/>
    <circle cx="360" cy="315" r="4"/>
    <circle cx="420" cy="315" r="4"/>
    <circle cx="510" cy="315" r="4"/>
  </g>

  <!-- Level 1 nodes -->
  <g fill="#09090b" stroke="#428bca" stroke-width="1.5">
    <circle cx="150" cy="200" r="14" opacity="0.7"/>
    <circle cx="300" cy="200" r="14" opacity="0.7"/>
    <circle cx="450" cy="200" r="14" opacity="0.7"/>
  </g>
  <g fill="#428bca" opacity="0.5">
    <circle cx="150" cy="200" r="7"/>
    <circle cx="300" cy="200" r="7"/>
    <circle cx="450" cy="200" r="7"/>
  </g>

  <!-- Root node — CTO -->
  <circle cx="300" cy="70" r="28" fill="#09090b" stroke="#428bca" stroke-width="2" opacity="0.9" filter="url(#softglow)"/>
  <circle cx="300" cy="70" r="14" fill="url(#nodeGlow)" opacity="0.7" filter="url(#glow)"/>
  <circle cx="300" cy="70" r="6" fill="#dde3ee" opacity="0.9"/>

  <!-- Crown-like accent arcs above root -->
  <g fill="none" stroke="#428bca" opacity="0.3" stroke-width="1">
    <path d="M270,55 Q300,30 330,55" />
    <path d="M280,48 Q300,22 320,48" />
    <path d="M260,60 Q300,15 340,60" />
  </g>
  <g fill="#428bca" opacity="0.5">
    <circle cx="270" cy="55" r="2.5"/>
    <circle cx="300" cy="30" r="2.5"/>
    <circle cx="330" cy="55" r="2.5"/>
    <circle cx="280" cy="48" r="2"/>
    <circle cx="320" cy="48" r="2"/>
    <circle cx="260" cy="60" r="2"/>
    <circle cx="340" cy="60" r="2"/>
  </g>

  <!-- Outer ring on root -->
  <circle cx="300" cy="70" r="38" fill="none" stroke="#428bca" stroke-width="0.5" opacity="0.2" stroke-dasharray="3 6"/>

  <!-- Decorative horizontal rule at root level -->
  <line x1="80" y1="70" x2="220" y2="70" stroke="#428bca" stroke-width="0.5" opacity="0.12"/>
  <line x1="380" y1="70" x2="520" y2="70" stroke="#428bca" stroke-width="0.5" opacity="0.12"/>

  <!-- Ambient floating dots -->
  <g fill="#428bca" opacity="0.08">
    <circle cx="30" cy="50" r="2"/>
    <circle cx="570" cy="80" r="2"/>
    <circle cx="50" cy="200" r="1.5"/>
    <circle cx="555" cy="200" r="1.5"/>
    <circle cx="20" cy="340" r="1.5"/>
    <circle cx="580" cy="350" r="1.5"/>
  </g>

  <!-- Border -->
  <rect width="600" height="400" fill="none" stroke="#428bca" stroke-width="0.5" opacity="0.07"/>
</svg>
