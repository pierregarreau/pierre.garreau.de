<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0ebe4"/>
      <stop offset="100%" stop-color="#f0ebe4"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#428bca" stop-opacity="0"/>
      <stop offset="30%" stop-color="#428bca" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6aaee0" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a6496" stop-opacity="0"/>
      <stop offset="50%" stop-color="#428bca" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#428bca" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="fillGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#428bca" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#428bca" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip">
      <rect width="600" height="400"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g opacity="0.06" stroke="#428bca" stroke-width="0.5">
    <line x1="0" y1="80" x2="600" y2="80"/>
    <line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="320" x2="600" y2="320"/>
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="500" y1="0" x2="500" y2="400"/>
  </g>

  <!-- Candlestick bars — rising columns -->
  <g clip-path="url(#clip)" opacity="0.18" fill="#428bca">
    <rect x="28" y="290" width="12" height="90" rx="1"/>
    <rect x="62" y="260" width="12" height="120" rx="1"/>
    <rect x="96" y="230" width="12" height="150" rx="1"/>
    <rect x="130" y="200" width="12" height="180" rx="1"/>
    <rect x="164" y="170" width="12" height="210" rx="1"/>
    <rect x="198" y="150" width="12" height="230" rx="1"/>
    <rect x="232" y="130" width="12" height="250" rx="1"/>
    <rect x="266" y="110" width="12" height="270" rx="1"/>
    <rect x="300" y="140" width="12" height="240" rx="1"/>
    <rect x="334" y="100" width="12" height="280" rx="1"/>
    <rect x="368" y="80" width="12" height="300" rx="1"/>
    <rect x="402" y="60" width="12" height="320" rx="1"/>
    <rect x="436" y="90" width="12" height="290" rx="1"/>
    <rect x="470" y="50" width="12" height="330" rx="1"/>
    <rect x="504" y="70" width="12" height="310" rx="1"/>
    <rect x="538" y="40" width="12" height="340" rx="1"/>
    <rect x="572" y="30" width="12" height="350" rx="1"/>
  </g>

  <!-- Wick lines -->
  <g opacity="0.12" stroke="#428bca" stroke-width="1">
    <line x1="34" y1="270" x2="34" y2="295"/>
    <line x1="68" y1="240" x2="68" y2="265"/>
    <line x1="102" y1="210" x2="102" y2="235"/>
    <line x1="136" y1="180" x2="136" y2="205"/>
    <line x1="170" y1="150" x2="170" y2="175"/>
    <line x1="204" y1="130" x2="204" y2="155"/>
    <line x1="238" y1="110" x2="238" y2="135"/>
    <line x1="272" y1="90" x2="272" y2="115"/>
    <line x1="306" y1="120" x2="306" y2="145"/>
    <line x1="340" y1="80" x2="340" y2="105"/>
    <line x1="374" y1="60" x2="374" y2="85"/>
    <line x1="408" y1="40" x2="408" y2="65"/>
    <line x1="442" y1="70" x2="442" y2="95"/>
    <line x1="476" y1="30" x2="476" y2="55"/>
    <line x1="510" y1="50" x2="510" y2="75"/>
    <line x1="544" y1="20" x2="544" y2="45"/>
    <line x1="578" y1="10" x2="578" y2="35"/>
  </g>

  <!-- Wave 1 — main performance curve -->
  <path clip-path="url(#clip)"
    d="M-10,320 C30,310 60,280 100,250 C140,220 160,240 200,200 C240,160 260,130 300,120 C340,110 360,140 400,100 C440,60 460,80 500,60 C540,40 570,50 620,30 L620,400 L-10,400 Z"
    fill="url(#fillGrad)" opacity="0.7"/>
  <path clip-path="url(#clip)"
    d="M-10,320 C30,310 60,280 100,250 C140,220 160,240 200,200 C240,160 260,130 300,120 C340,110 360,140 400,100 C440,60 460,80 500,60 C540,40 570,50 620,30"
    fill="none" stroke="url(#wave1)" stroke-width="2" filter="url(#glow)"/>

  <!-- Wave 2 — second strategy -->
  <path clip-path="url(#clip)"
    d="M-10,350 C50,340 80,320 130,290 C180,260 200,280 240,250 C280,220 290,200 330,180 C370,160 390,190 430,160 C470,130 490,150 540,120 C570,105 590,110 620,100"
    fill="none" stroke="#428bca" stroke-width="1.5" opacity="0.45"/>

  <!-- Wave 3 — third strategy -->
  <path clip-path="url(#clip)"
    d="M-10,370 C40,365 70,355 110,340 C150,325 170,340 210,320 C250,300 270,280 310,270 C350,260 380,275 420,255 C460,235 480,245 530,220 C555,208 580,215 620,200"
    fill="none" stroke="#6aaee0" stroke-width="1" opacity="0.3"/>

  <!-- Wave 4 — lagging strategy -->
  <path clip-path="url(#clip)"
    d="M-10,380 C60,378 100,372 150,368 C200,364 220,370 260,362 C300,354 320,345 360,338 C400,331 430,340 470,328 C510,316 540,322 620,310"
    fill="none" stroke="#2a6496" stroke-width="1" opacity="0.25"/>

  <!-- Wave 5 — volatile strategy -->
  <path clip-path="url(#clip)"
    d="M-10,300 C20,280 40,310 80,270 C120,230 140,270 180,230 C220,190 240,230 280,200 C320,170 340,210 380,170 C420,130 440,170 480,140 C520,110 550,150 620,120"
    fill="none" stroke="#428bca" stroke-width="1" opacity="0.2"/>

  <!-- Accent dots at peaks -->
  <g filter="url(#glow)">
    <circle cx="300" cy="120" r="3.5" fill="#428bca" opacity="0.9"/>
    <circle cx="400" cy="100" r="3" fill="#6aaee0" opacity="0.8"/>
    <circle cx="500" cy="60" r="4" fill="#428bca" opacity="1"/>
    <circle cx="200" cy="200" r="2.5" fill="#428bca" opacity="0.7"/>
    <circle cx="100" cy="250" r="2" fill="#2a6496" opacity="0.6"/>
  </g>

  <!-- Horizontal reference lines -->
  <line x1="0" y1="120" x2="600" y2="120" stroke="#428bca" stroke-width="0.5" stroke-dasharray="4 8" opacity="0.15"/>
  <line x1="0" y1="60" x2="600" y2="60" stroke="#428bca" stroke-width="0.5" stroke-dasharray="4 8" opacity="0.1"/>

  <!-- Corner accent -->
  <rect x="0" y="0" width="600" height="400" fill="none" stroke="#428bca" stroke-width="0.5" opacity="0.08"/>
</svg>
